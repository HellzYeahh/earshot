# Build JVM: whatever JAVA_HOME points at (JDK 17 or newer; CI uses 21). No org.gradle.java.home
# here: a path for one PC breaks the build everywhere else (CI, F-Droid, Linux and macOS). On the
# developer's PC gw.cmd sets JAVA_HOME to Android Studio's bundled JDK, and Android Studio uses its
# own Gradle JDK setting.

# Several checkouts of this project build in parallel on one PC: keep each daemon small. The Kotlin
# daemon needs 2 GB since 1.0's two flavours (play, foss) compile the app side by side.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 settings (match Android Studio's defaults for this AGP line).
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=true
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true
# Use the standalone Kotlin Android plugin and the classic DSL.
android.builtInKotlin=false
android.newDsl=false
