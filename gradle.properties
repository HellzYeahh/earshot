# Build JVM. Android Studio's bundled JDK so no JAVA_HOME is needed on this machine.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# Several checkouts of this project build in parallel on one PC: keep each daemon small.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 settings (match Android Studio's defaults for this AGP line).
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=true
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true
# Use the standalone Kotlin Android plugin and the classic DSL.
android.builtInKotlin=false
android.newDsl=false
